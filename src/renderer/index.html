<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/afgevinkt-check.svg" />
    <!-- Strikt: de renderer haalt niets van internet. Transcriptie (incl. de
         eenmalige modeldownload) draait in het main-proces via Node-fetch, niet
         hier. Login/upload/transcribe lopen via IPC, niet via de CSP. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' blob: data:"
    />
    <title>Afgevinkt Recorder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
